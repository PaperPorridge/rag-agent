[project]
name = "knowflow"
version = "0.1.0"
description = "KnowFlow - 企业级 RAG 知识库智能体平台"
requires-python = ">=3.12"
dependencies = [
    # --- LLM 与提示词 ---
    "openai>=1.60.0",          # MiMo 兼容 OpenAI 协议，直接用官方 SDK
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # --- 工程化基础 ---
    "tenacity>=9.0.0",         # 重试与退避
    "structlog>=24.4.0",       # 结构化日志（可解析、可进 ELK）
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",           # 提示词模板引擎
    "tiktoken>=0.8.0",         # token 计数（估算成本）
    # --- 后续模块按需启用，避免一次性装一堆 ---
    # M2 RAG: langchain, langchain-qdrant, qdrant-client, rank-bm25, sentence-transformers
    # M3 Agent: 同 langchain，工具用 pydantic 定义
    # M4 数据层: sqlalchemy[asyncio], asyncpg, alembic, redis
    # M5 队列: aiokafka
    # M6 服务: fastapi, uvicorn[standard]
    # M7 评估: 已拆成可选组 [eval]，见下方
]

[project.optional-dependencies]
# M2 · RAG：向量库 + 语义向量 + 重排
rag = [
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
]
# 文档解析：PDF 文本层（pypdf 零编译依赖，纯 Python）
ingest = [
    "pypdf>=5.0.0",
]
# M4 · 数据层：关系库 ORM + 迁移 + 缓存
data = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.2.0",   # 生产 PostgreSQL 驱动
]
# M4.5 · LangChain 对照：核心链路手写，周边生态用它
langchain = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.7.0",
    "langchain-community>=0.4.0",   # 已 sunset，仅 BM25Retriever 等遗留组件
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.0",
    "langsmith>=0.14.0",
]
# LangGraph 编排层（多 Agent 图 / interrupt 审批 / Send 扇出）
#
# 【为什么要钉死小版本？】
#   langchain-community sunset 之后 EnsembleRetriever 换了位置，旧教程直接跑不起来。
#   LangGraph 1.x 更名同样频繁：Send 从 langgraph.graph 搬到 langgraph.types，
#   create_react_agent（langgraph.prebuilt）与 create_agent（langchain.agents）分居两处。
#   实测导入路径锁在 tests/test_langgraph_smoke.py，升级前先跑它。
graph = [
    "langgraph==1.2.16",
    "langgraph-prebuilt==1.1.1",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2",    # 开发/测试持久化
    "langgraph-checkpoint-postgres==3.2.0",  # 生产持久化（S4 起）
    "psycopg[binary]>=3.2.0",                # PostgresSaver 的驱动，缺它 import 就炸
    "langchain-core==1.6.12",
]
# M5 · 队列：Kafka 客户端 + RabbitMQ 客户端（开发降级用 InMemoryQueue）
queue = [
    "aiokafka>=0.11.0",
    "aio-pika>=9.4.0",
]
# M6 · 服务化：HTTP API
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",   # 文件上传
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",              # FastAPI TestClient 依赖
    "ruff>=0.7.0",
    "ipykernel>=6.29.0",
]
# M7 · 评估：RAGAS（LLM-as-judge）+ HuggingFace datasets
#
# 【为什么是可选组而不是主依赖？】
#   1. ragas 拉一堆传递依赖（datasets/evaluate/nlp...），装了会拖慢冷启动
#   2. CI 回归只跑 SimpleEvaluator（免费、秒级、不联网），用不到 ragas
#   3. 真跑 ragas 要花 LLM 的钱 —— 依赖也该显式装，不该静默发生
# 装法: pip install -e ".[rag,eval]"   报告: python -m knowflow.eval.report
eval = [
    "ragas>=0.2.0",
    "datasets>=2.18.0",
    # ragas 的 judge 只吃 LangChain Runnable 包装过的 LLM，
    # 不吃裸 OpenAI 客户端 —— 缺这个 RagasEvaluator 只能降级
    "langchain-openai>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
